<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ຫ້ອງພັກ — ລະບົບຈັດການອາພາດເມັນ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="rooms">
<main class="page-wrap">
  <div class="page-head">
    <div>
      <h1>ຈັດການຫ້ອງພັກ</h1>
    </div>
    <div class="head-actions">
      <button class="btn btn-add-room" id="addRoomBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
        ເພີ່ມຫ້ອງໃໝ່
      </button>
    </div>
  </div>

  <div class="stat-grid grid-5" id="roomStats"></div>

  <section class="card table-card mt-14">
    <div class="table-head">
      <div>
        <h2>ລາຍການຫ້ອງພັກ</h2>
        <div class="t-sub" id="roomsCount">ທັງໝົດ 12 ຫ້ອງ</div>
      </div>
      <div class="grow"></div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="roomSearch" placeholder="ຄົ້ນຫາຫ້ອງ ຫຼື ຜູ້ເຊົ່າ">
      </div>
      <div class="tabs" id="roomTabs">
        <button class="on" data-filter="all">ທັງໝົດ</button>
        <button data-filter="occupied">ມີຜູ້ເຊົ່າ</button>
        <button data-filter="vacant">ຫ້ອງວ່າງ</button>
        <button data-filter="repair">ສ້ອມແປງ</button>
      </div>
    </div>

    <table class="data">
      <thead>
        <tr>
          <th style="width:150px">ຫ້ອງ</th>
          <th style="width:126px">ປະເພດ</th>
          <th>ຜູ້ເຊົ່າ</th>
          <th style="width:150px">ມິດິເອີຣ໌ລ່າສຸດ</th>
          <th style="width:132px">ສະຖານະ</th>
          <th style="width:110px;text-align:right">ຈັດການ</th>
        </tr>
      </thead>
      <tbody id="roomsBody"></tbody>
    </table>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/db.config.js"></script>
<script src="assets/db.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let filter = "all";
  let query = "";

  const STATUS = {
    occupied: { cls: "occupied", text: "ມີຜູ້ເຊົ່າ" },
    vacant: { cls: "vacant", text: "ຫ້ອງວ່າງ" },
    repair: { cls: "repair", text: "ສ້ອມແປງ" }
  };
  const statusLabel = (s) => (STATUS[s] || STATUS.vacant).text;

  function renderStats() {
    const total = ROOMS.length;
    const occupied = ROOMS.filter((r) => r.status === "occupied").length;
    const vacant = ROOMS.filter((r) => r.status === "vacant").length;
    const repair = ROOMS.filter((r) => r.status === "repair").length;
    const rate = Math.round((occupied / total) * 100);

    document.getElementById("roomsCount").textContent = `ທັງໝົດ ${total} ຫ້ອງ`;
    document.getElementById("roomStats").innerHTML = `
      <div class="stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon">${icon("door", 16)}</span>
        <div class="stat-label">ຫ້ອງທັງໝົດ</div>
        <div class="stat-value">${total}</div>
      </div>
      <div class="stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon">${icon("home", 16)}</span>
        <div class="stat-label">ມີຜູ້ເຊົ່າ</div>
        <div class="stat-value">${occupied}</div>
        <div class="mini-bar"><i style="width:${rate}%"></i></div>
        <div class="stat-foot">${rate}% ຂອງທັງໝົດ</div>
      </div>
      <div class="stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon amber">${icon("door", 16)}</span>
        <div class="stat-label">ຫ້ອງວ່າງ</div>
        <div class="stat-value">${vacant}</div>
      </div>
      <div class="stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon cyan">${icon("tool", 16)}</span>
        <div class="stat-label">ສ້ອມແປງ</div>
        <div class="stat-value">${repair}</div>
      </div>
      <div class="stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon violet">${icon("calendar", 16)}</span>
        <div class="stat-label">(ໃກ້ຈະໝົດສັນຍາ)</div>
        <div class="stat-value">0</div>
      </div>`;
  }

  // ຮຽງຕາມເບີຫ້ອງແບບຕົວເລກ: 1, 2, 3, …, 101, 102, 201, …
  const roomNo = (no) => {
    const n = parseInt(String(no).replace(/\D/g, ""), 10);
    return Number.isNaN(n) ? Number.MAX_SAFE_INTEGER : n;
  };

  function renderTable() {
    const q = query.trim().toLowerCase();
    const list = ROOMS.filter((r) => (filter === "all" || r.status === filter))
      .filter((r) => !q || r.no.includes(q) || (r.tenant || "").toLowerCase().includes(q))
      .sort((a, b) => roomNo(a.no) - roomNo(b.no) || a.no.localeCompare(b.no));

    document.getElementById("roomsBody").innerHTML = list.length
      ? list
          .map((r, idx) => {
            const s = STATUS[r.status];
            const t = r.status === "occupied" ? TENANTS.find((x) => String(x.room) === String(r.no)) : null;
            const stay = t ? stayStatus(t.stayStatus) : null;
            return `<tr style="--sc:var(--primary)">
              <td>
                <div class="room-cell">
                  <span class="room-no">${r.no}</span>
                  <div class="rc-txt"><strong>ຫ້ອງ ${r.no}</strong><span>ຊັ້ນ ${r.floor}</span></div>
                </div>
              </td>
              <td>${r.type}</td>
              <td class="tenant-cell">
                ${r.tenant ? `<strong>${r.tenant}</strong><span>${r.phone}</span>` : '<span class="muted">—</span>'}
              </td>
              <td class="num muted">ໄຟ ${num(r.meterElec)} · ນ້ຳ ${num(r.meterWater)}</td>
              <td><div class="st-stack"><span class="status ${s.cls}"><i class="sd"></i>${s.text}</span>${stay ? `<span class="chip ${stay.cls}">${stay.label}</span>` : ""}</div></td>
              <td>
                <div class="row-actions">
                  <button title="ຈົດມິເຕີ" onclick="location.href='meter.html?room=${r.no}'">${icon("refresh", 13)}</button>
                  <button title="ແກ້ໄຂ" data-edit="${r.no}">${icon("edit", 13)}</button>
                  <button class="danger" title="ລຶບ" data-del="${r.no}">${icon("trash", 13)}</button>
                </div>
              </td>
            </tr>`;
          })
          .join("")
      : `<tr><td colspan="6"><div class="empty">ບໍ່ພົບຫ້ອງທີ່ຄົ້ນຫາ</div></td></tr>`;

    document.querySelectorAll("[data-edit]").forEach((b) =>
      b.addEventListener("click", () => openRoomForm(roomByNo(b.dataset.edit)))
    );
    document.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => {
        const r = roomByNo(b.dataset.del);
        if (!r) return;
        openConfirm(
          `ລຶບຫ້ອງ ${r.no} ອອກຈາກລາຍການ?`,
          "ຂໍ້ມູນຫ້ອງນີ້ຈະຖືກລຶບ ແລະ ບັນທຶກລົງຖານຂໍ້ມູນທັນທີ. ບໍ່ສາມາດຍ້ອນກັບໄດ້.",
          () => {
            logActivity("room", "ລຶບຫ້ອງ", `ຫ້ອງ ${r.no} · ຊັ້ນ ${r.floor}`);
            ROOMS.splice(ROOMS.indexOf(r), 1);
            renderAll();
            DB.save();
          }
        );
      })
    );
  }

  function openRoomForm(room) {
    const isEdit = !!room;
    openModal(
      isEdit ? `ແກ້ໄຂຫ້ອງ ${room.no}` : "ເພີ່ມຫ້ອງໃໝ່",
      isEdit ? "ປັບປຸງຂໍ້ມູນຫ້ອງພັກ" : "ບັນທຶກຫ້ອງພັກເຂົ້າໃນອາຄານ",
      `<div class="m-grid">
        <div class="field"><label>ເລກຫ້ອງ</label><input class="input" id="fNo" value="${isEdit ? room.no : ""}" placeholder="101"></div>
        <div class="field"><label>ຊັ້ນ</label><input class="input" id="fFloor" type="number" value="${isEdit ? room.floor : 1}"></div>
        <div class="field"><label>ປະເພດ</label>
          <select class="input" id="fType">
            <option ${!isEdit || !room.type.includes("2") ? "selected" : ""}>1 ຫ້ອງນອນ</option>
            <option ${isEdit && room.type.includes("2") ? "selected" : ""}>2 ຫ້ອງນອນ</option>
          </select>
        </div>

        <div class="field full"><label>ສະຖານະ</label>
          <div class="input readonly-status">${isEdit ? statusLabel(room.status) : "ຫ້ອງວ່າງ"}</div>
          <div class="hint-line">ສະຖານະມາຈາກບັນຊີຜູ້ເຊົ່າ — ຖ້າຕ້ອງການປ່ຽນ ໃຫ້ແກ້ໄຂທີ່ໜ້າຜູ້ເຊົ່າ</div>
        </div>
      </div>`,
      (back) => {
        const no = back.querySelector("#fNo").value.trim();
        if (!no) return false;
        const data = {
          no,
          floor: Number(back.querySelector("#fFloor").value) || 1,
          type: back.querySelector("#fType").value,
          rent: Number(APT.rent) || 0,
          status: isEdit ? room.status : "vacant",
          tenant: isEdit ? room.tenant : null,
          phone: isEdit ? room.phone : null,
          meterElec: isEdit ? room.meterElec : 0,
          meterWater: isEdit ? room.meterWater : 0
        };
        if (isEdit) Object.assign(room, data);
        else ROOMS.push(data);
        logActivity(
          "room",
          isEdit ? `ແກ້ໄຂຫ້ອງ ${data.no}` : "ເພີ່ມຫ້ອງໃໝ່",
          `ຫ້ອງ ${data.no} · ຊັ້ນ ${data.floor} · ${data.type} · ຄ່າເຊົ່າ ${money(data.rent)}`
        );
        renderAll();
        DB.save();
      }
    );
  }

  function renderAll() {
    renderStats();
    renderTable();
  }

  document.getElementById("roomSearch").addEventListener("input", (e) => {
    query = e.target.value;
    renderTable();
  });
  document.getElementById("roomTabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-filter]");
    if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll("#roomTabs button").forEach((x) => x.classList.toggle("on", x === b));
    renderTable();
  });
  document.getElementById("addRoomBtn").addEventListener("click", () => openRoomForm(null));

  DB.ready.then(renderAll);
});
</script>
</body>
</html>
