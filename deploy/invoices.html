<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ໃບບີນເກັບເງີນ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<!-- ຂະໜາດເຈ້ຍຕອນພິມ: ວ່າງ = A5 (ຄ່າຫຼັກ), A4 = ຂຽນທັບຈາກ JS -->
<style>@page { size: A4 portrait; margin: 6mm; }</style>
</head>
<body data-page="invoices">
<main class="page-wrap">
  <div class="page-head">
    <div>
      <p class="eyebrow">ໃບບີນເກັບເງີນ</p>
      <h1>ໃບບີນເກັບເງີນປະຈຳເດືອນ</h1>
      <p class="page-sub">ຄ່າເຊົ່າ, ຄ່າໄຟຟ້າ, ຄ່ານ້ຳ ແລະ ຄ່າບໍລິການ ເປັນຕົ້ນ</p>
    </div>
    <div class="head-actions">
      <div class="pill-group" id="monthSwitch"></div>
    </div>
  </div>

  <div class="stat-grid grid-5" id="invoiceStats"></div>

  <section class="card card-pad mt-14">
    <div class="card-head">
      <div>
        <h2>ອົງປະກອບຄ່າໃຊ້ຈ່າຍເດືອນນີ້</h2>
        <p class="card-sub" id="costSub"></p>
      </div>
    </div>
    <div class="stat-grid grid-3" id="costStats"></div>
  </section>

  <section class="card table-card mt-14">
    <div class="table-head">
      <div>
        <h2>ລາຍການໃບບີນເກັບເງີນ</h2>
        <div class="t-sub" id="invoiceCount">ພະຈິກ 2026 · 7 ໃບ</div>
      </div>
      <div class="grow"></div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="invoiceSearch" placeholder="ຄົ້ນຫາເລກທີ / ຫ້ອງ">
      </div>
      <button class="btn btn-outline btn-sm" id="expandAll" style="width:auto;padding:0 12px">ຂະຫຍາຍທັງໝົດ</button>
      <div class="tabs" id="invoiceTabs">
        <button class="on" data-filter="all">ທັງໝົດ</button>
        <button data-filter="unpaid">ຄ້າງ</button>
        <button data-filter="paid">ຊຳລະແລ້ວ</button>
        <button data-filter="pending">ຍັງບໍ່ອອກໃບ</button>
      </div>
    </div>

    <table class="data inv-table">
      <thead>
        <tr>
          <th style="width:140px">ເລກທີ</th>
          <th>ຫ້ອງ / ຜູ້ເຊົ່າ</th>
          <th style="width:86px" title="ເລກໃໝ່ຂອງເດືອນກ່ອນ ທີ່ຈົດໄວ້ໃນໜ້າມິເຕີ">ເລກກ່ອນ</th>
          <th style="width:86px" title="ເລກມິເຕີທີ່ຈົດໄວ້ຂອງເດືອນນີ້">ເລກໃໝ່</th>
          <th style="width:100px">ໄຟຟ້າ</th>
          <th style="width:88px">ນ້ຳ</th>
          <th style="width:126px">ຍອດລວມ</th>
          <th style="width:150px">ສະຖານະ</th>
          <th style="width:176px;text-align:right">ຈັດການ</th>
        </tr>
      </thead>
      <tbody id="invoiceBody"></tbody>
    </table>
  </section>

  <!-- ຂໍ້ຄວາມປະຈຳເດືອນ (ຈາກໜ້າຕັ້ງຄ່າ) -->
  <section class="card card-pad mt-14 month-note-card" id="monthNoteCard" hidden>
    <div class="mn-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/></svg>
    </div>
    <div class="mn-body">
      <strong>ແຈ້ງການປະຈຳເດືອນ · <span id="monthNoteMonth"></span></strong>
      <p id="monthNoteText"></p>
      <p id="monthNoteText2"></p>
    </div>
    <a class="btn btn-outline btn-sm" id="monthNoteEdit" href="settings.html" style="width:auto;padding:0 12px">ແກ້ໄຂ</a>
  </section>
</main>

<!-- ໃບບີນເກັບເງີນສຳລັບພິມ (ເຫັນສະເພາະຕອນພິມ) -->
<section class="print-sheet" id="printSheet"></section>

<!-- ເບິ່ງໃບບີນເກັບເງີນກ່ອນພິມ -->
<div class="modal-backdrop" id="billPreview" inert>
  <div class="modal bill-preview" role="dialog" aria-modal="true" aria-labelledby="billPreviewTitle">
    <h3 id="billPreviewTitle">ເບິ່ງໃບບີນເກັບເງີນກ່ອນພິມ</h3>
    <p class="m-sub" id="billPreviewSub"></p>
    <div id="billPreviewBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" data-preview-close>ປິດ</button>
      <button class="btn btn-ghost btn-sm" data-preview-pdf>ດາວໂຫຼດ PDF</button>
      <button class="btn btn-primary btn-sm" data-preview-print>ພິມໃບບີນ</button>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/db.config.js"></script>
<script src="assets/db.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let filter = "all";
  let query = "";
  /* ເປີດຈາກລິ້ງ ?y=2026&m=2 (ເຊັ່ນ ຈາກການ์ຂໍ້ຄວາມປະຈຳເດືອນ) */
  function monthFromQuery() {
    const p = new URLSearchParams(location.search);
    const y = Number(p.get("y"));
    const m = Number(p.get("m"));
    if (Number.isInteger(y) && y >= 2000 && y <= 2100 && Number.isInteger(m) && m >= 1 && m <= 12)
      return { year: y, month: m };
    return null;
  }
  let state = monthFromQuery() || { ...APT.current };
  /* ເລກໃບທີ່ກຳລັງຂະຫຍາຍລາຍລະອຽດ */
  const expanded = new Set();

  /* ເລກມິເຕີໄຟຟ້າ: ເລກກ່ອນ / ເລກໃໝ່ ຂອງແຕ່ລະໃບ (ຈາກເລກທີ່ຈົດໄວ້ໃນໜ້າມິເຕີ) */
  const monthIdx = (key) => {
    const [y, m] = key.split("-").map(Number);
    return y * 12 + m;
  };

  /* ເດືອນທີ່ມີໃບບີນຫຼ້າສຸດ — ໃຊ້ເປັນເດືອນເລີ່ມຕົ້ນ ຖ້າເດືອນປັດຈຸບັນຍັງບໍ່ມີໃບ */
  /* ເດືອນເກົ່າສຸດທີ່ມີຂໍ້ມູນ (ໃບບີນ / ເລກມິເຕີ / ອັດຕາ) — ເພື່ອໃຫ້ກົດກັບໄດ້ */
  function earliestDataMonth() {
    const keys = new Set();
    Object.keys(INVOICE_MONTHS || {}).forEach((k) => {
      if ((INVOICE_MONTHS[k] || []).length) keys.add(k);
    });
    Object.values(APT.meterReadings || {}).forEach((map) =>
      Object.keys(map || {}).forEach((k) => {
        if (map[k] != null) keys.add(k);
      })
    );
    Object.keys(APT.ratesByMonth || {}).forEach((k) => keys.add(k));
    if (!keys.size) return null;
    const sorted = [...keys].filter((k) => /^\d{4}-\d{1,2}$/.test(k)).sort((a, b) => monthIdx(a) - monthIdx(b));
    if (!sorted.length) return null;
    const [y, m] = sorted[0].split("-").map(Number);
    return { year: y, month: m };
  }

  function monthWithInvoices() {
    const keys = Object.keys(INVOICE_MONTHS || {}).filter((k) => (INVOICE_MONTHS[k] || []).length);
    if (!keys.length) return null;
    keys.sort((a, b) => monthIdx(a) - monthIdx(b));
    const [y, m] = keys[keys.length - 1].split("-").map(Number);
    return { year: y, month: m };
  }

  function meterPair(inv, m, y) {
    const key = `${y}-${String(m).padStart(2, "0")}`;
    const map = (APT.meterReadings || {})[inv.room] || {};
    const cur = monthIdx(key);
    const recorded = map[key] != null ? Number(map[key]) : null;
    // ເລກກ່ອນ = ເລກໃໝ່ຂອງເດືອນກ່ອນທີ່ໃກ້ທີ່ສຸດທີ່ຈົດໄວ້
    let prevRec = null;
    Object.keys(map).forEach((k) => {
      if (monthIdx(k) < cur && (!prevRec || monthIdx(k) > monthIdx(prevRec.key))) {
        prevRec = { key: k, val: Number(map[k]) || 0 };
      }
    });
    const kwh = Number(inv.kwh) || 0;
    let prev = prevRec ? prevRec.val : null;
    let now = recorded;
    if (now !== null && prev === null) prev = Math.max(0, now - kwh);
    if (now === null && prev !== null) now = prev + kwh;
    return { prev, now };
  }

  /* ລາຍລະອຽດສະຫຼຸບໃບບີນເກັບເງີນ — 7 ແຖວຄືໃນໜ້າມິເຕີ */
  function invoiceLines(inv) {
    const t = tenantOfRoom(inv.room);
    const extras = otherFeesTotal(inv.year, inv.month);
    const repairs = repairItemsFor(inv.room, invoiceMonthKey(inv));
    const repair = repairs.reduce((s, x) => s + (Number(x.cost) || 0), 0);
    const rt = invoiceRates(inv);
    const water = waterCostFor(inv.room, rt);
    const trash = trashCostFor(inv.room, rt);
    const service = serviceCostFor(inv.room, rt);
    return [
      { k: "ຄ່າເຊົ່າ", v: inv.rent },
      { k: `ຄ່າໄຟຟ້າ (${num(inv.kwh)} kWh × ${money(rt.electricRate)})`, v: inv.kwh * rt.electricRate },
      {
        k: water
          ? `ຄ່ານ້ຳ (${money(rt.waterTotal)} ÷ ${residentPeople()} ຄົນ × ${t ? tenantPeople(t) : 0} ຄົນ)`
          : "ຄ່ານ້ຳ (ໄປຕ່າງແຂວງ — ບໍ່ຄິດ)",
        v: water
      },
      {
        k: trash
          ? `ຄ່າຂີ້ເຫຍື້ອ (${money(rt.trashTotal)} ÷ ${residentRoomCount()} ຫ້ອງຢູ່ປະຈຳ)`
          : "ຄ່າຂີ້ເຫຍື້ອ (ໄປຕ່າງແຂວງ — ບໍ່ຄິດ)",
        v: trash
      },
      {
        k: repairs.length ? `ສ້ອມແປງ (${repairs.length} ລາຍການ)` : "ສ້ອມແປງ (ບໍ່ມີໃນເດືອນນີ້)",
        v: repair,
        sub: repairs.map((r) => ({ k: r.title, v: Number(r.cost) || 0 }))
      },
      {
        k: service
          ? `ຄ່າບໍລິການສ່ວນກາງ (${money(rt.serviceFee)} ÷ ${residentRoomCount()} ຫ້ອງຢູ່ປະຈຳ)`
          : "ຄ່າບໍລິການສ່ວນກາງ (ຍັງບໍ່ຕັ້ງຄ່າ)",
        v: service
      },
      {
        k: extras
          ? `ຄ່າອື່ນໆ (ລາຍການເພີ່ມເຕີມ ${money(extras)} ÷ ${residentRoomCount()} ຫ້ອງຢູ່ປະຈຳ)`
          : "ຄ່າອື່ນໆ",
        v: (inv.other || 0) + extraFeesShareFor(inv.room, inv.year, inv.month)
      }
    ];
  }

  const detailRow = (inv) => `
        <tr class="inv-detail-row"><td colspan="9">
          <div class="inv-detail">
            <div class="inv-detail-head">
              <strong>ສະຫຼຸບໃບບີນເກັບເງີນ ${inv.no}</strong>
              <span>ກຳນົດຊຳລະ ${inv.due} · ຫ້ອງ ${inv.room}</span>
            </div>
            <div class="inv-lines">
              ${invoiceLines(inv)
                .map(
                  (l) =>
                    l.sub && l.sub.length
                      ? `<div class="inv-line has-sub">
                           <div class="inv-line-main"><span>${l.k}</span><b>${money(l.v)}</b></div>
                           <ul class="inv-sub">${l.sub
                             .map((s) => `<li><span>${s.k}</span><b>${money(s.v)}</b></li>`)
                             .join("")}</ul>
                         </div>`
                      : `<div class="inv-line${l.v ? "" : " zero"}"><span>${l.k}</span><b>${money(l.v)}</b></div>`
                )
                .join("")}
            </div>
            <div class="inv-detail-foot"><span>ຄວາມຄວນຊຳລະລວມ</span><b>${money(invoiceTotal(inv))}</b></div>
          </div>
        </td></tr>`;

  /* ໃບບີນເກັບເງີນສຳລັບພິມ — 7 ແຖວລາຍລະອຽດລຳດັບດຽວກັນ */
  function buildPrintSheet(inv) {
    const tenant = tenantOfRoom(inv.room);
    inv = { ...inv, tenantPhone: (tenant && tenant.phone) || "" };
    const mp = meterPair(inv, state.month, state.year);
    const [y, m] = invoiceMonthKey(inv).split("-");
    const meter = `${mp.prev === null ? "—" : num(mp.prev)} → ${mp.now === null ? "—" : num(mp.now)}`;
    return `
      <div class="ps-head">
        <img class="ps-logo" src="assets/logo.png" alt="${APT.name}" onerror="this.remove()">
        <div class="ps-head-row">
          <div>
            <span class="ps-apt">${APT.name}</span>
            <span class="ps-sub">${APT.address}</span>
          </div>
          <div class="ps-doc">
            <strong>ໃບບີນເກັບເງີນ ${inv.no}</strong>
            <span>ປະຈຳ ${monthLabel(Number(m), Number(y))} · ກຳນົດຊຳລະ ${inv.due}</span>
          </div>
        </div>
      </div>
      <div class="ps-info">
        <div><span>ຫ້ອງ</span><strong>${inv.room}</strong></div>
        <div><span>ຜູ້ເຊົ່າ</span><strong>${inv.tenant}</strong>${inv.tenantPhone ? `<em class="ps-phone">${inv.tenantPhone}</em>` : ""}</div>
        <div><span>ເລກມິເຕີໄຟຟ້າ</span><strong>${meter}</strong></div>
        <div><span>ໄຊ້ໄຟຟ້າ</span><strong>${num(inv.kwh)} kWh</strong></div>
      </div>
      <table class="ps-lines">
        <thead><tr><th>ລາຍການ</th><th>ຈຳນວນເງິນ</th></tr></thead>
        <tbody>${invoiceLines(inv)
          .flatMap((l) => {
            const main = `<tr class="${l.sub && l.sub.length ? "ps-hassub" : ""}"><td>${l.k}</td><td>${money(l.v)}</td></tr>`;
            if (!l.sub || !l.sub.length) return [main];
            return [
              main,
              ...l.sub.map(
                (s, i) =>
                  `<tr class="ps-sub-line${i === l.sub.length - 1 ? " last" : ""}"><td>${s.k}</td><td>${money(s.v)}</td></tr>`
              )
            ];
          })
          .join("")}</tbody>
      </table>
      <div class="ps-notes">
        <div class="ps-notes-text">
          ${
            monthNoteFor(Number(y), Number(m))
              ? `<div class="ps-note"><span>ແຈ້ງການປະຈຳເດືອນ</span><p>${String(monthNoteFor(Number(y), Number(m)))
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")}</p></div>`
              : ""
          }
          ${
            monthNote2For(Number(y), Number(m))
              ? `<div class="ps-note"><span>ແຈ້ງການເພີ່ມເຕີມ</span><p>${String(monthNote2For(Number(y), Number(m)))
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")}</p></div>`
              : ""
          }
        </div>
        <div class="ps-qr">
          <img class="ps-qr-img" src="assets/qr.png" alt="QR ຊຳລະເງິນ" onerror="this.closest('.ps-qr').remove()">
          <span>ສະແກນ QR ເພື່ອຊຳລະເງິນ</span>
        </div>
      </div>
      <div class="ps-total">
        <span>ສະຖານະ · ${inv.paid ? "ຊຳລະແລ້ວ" : "ຄ້າງຊຳລະ"}</span>
        <b>${money(invoiceTotal(inv))}</b>
      </div>
      <div class="ps-foot">
        <span>${APT.address}</span>
        <span>ອອກໂດຍ ລະບົບຈັດການອາພາດເມັນ</span>
      </div>`;
  }

  /* ເບິ່ງຕົວຢ່າງໃບບີນກ່ອນພິມ */
  let previewInv = null;
  const PAPER = "a4"; /* ໃບບີນພິມດ້ວຍເຈ້ຍ A4 ຢ່າງດຽວ */

  function openBillPreview(inv) {
    previewInv = inv;
    document.getElementById("billPreviewSub").textContent = `ໃບ ${inv.no} · ຫ້ອງ ${inv.room} · ${inv.tenant}`;
    document.getElementById("billPreviewBody").innerHTML =
      `<div class="print-sheet is-preview">${buildPrintSheet(inv)}</div>`;
    fitBillToPage(document.querySelector("#billPreviewBody .print-sheet"), PAPER);
    const back = document.getElementById("billPreview");
    back.classList.add("open");
    back.inert = false;
    document.body.style.overflow = "hidden";
    document.getElementById("billPreviewBody").scrollTop = 0;
    back.querySelector("[data-preview-print]").focus({ preventScroll: true });
  }

  function closeBillPreview() {
    const back = document.getElementById("billPreview");
    back.classList.remove("open");
    back.inert = true;
    document.body.style.overflow = "";
  }

  function printPreviewBill() {
    if (!previewInv) return;
    document.getElementById("printSheet").innerHTML = buildPrintSheet(previewInv);
    fitBillToPage(document.getElementById("printSheet"), PAPER);
    closeBillPreview();
    setTimeout(() => window.print(), 80);
  }

  /* ດາວໂຫຼດໃບບີນເປັນ PDF — ໃຊ້ "Save as PDF" ຂອງເບຣົາເຊີ ເພື່ອໃຫ້ຂໍ້ຄວາມລາວສະແດງຄົບ
     ຊື່ໄຟລ໌ມາຈາກ document.title (ໃບບີນ-<ເລກທີ່>-ຫ້ອງ-<ຫ້ອງ>) */
  let pdfTitleBackup = null;
  function billPdfName(inv) {
    return `ໃບບີນ-${inv.no}-ຫ້ອງ-${inv.room}`;
  }
  function downloadBillPdf(inv) {
    if (!inv) return;
    closeBillPreview();
    const sheet = document.getElementById("printSheet");
    sheet.innerHTML = buildPrintSheet(inv);
    fitBillToPage(sheet, PAPER);
    pdfTitleBackup = document.title;
    document.title = billPdfName(inv);
    showStatusToast("", "ກຳລັງດາວໂຫຼດ PDF", `ໃບ ${inv.no} · ຫ້ອງ ${inv.room} · ເລືອກ “Save as PDF” ໃນໜ້າຕ່າງພິມ`);
    const restore = () => {
      if (pdfTitleBackup !== null) document.title = pdfTitleBackup;
      pdfTitleBackup = null;
      sheet.innerHTML = "";
      showStatusToast("ok", "ດາວໂຫຼດແລ້ວ", `ໃບ ${inv.no} · ຫ້ອງ ${inv.room}`);
    };
    window.addEventListener("afterprint", restore, { once: true });
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        if (pdfTitleBackup !== null) {
          document.title = pdfTitleBackup;
          pdfTitleBackup = null;
        }
      }, 1200);
    }, 80);
  }

  const meterCell = (v) =>
    v === null ? '<span class="muted" title="ຍັງບໍ່ມີເລກມິເຕີທີ່ຈົດໄວ້">—</span>' : `<span class="mono-num">${num(v)}</span>`;

  const monthKeySel = (m, y) => `${y}-${String(m).padStart(2, "0")}`;

  /* ຫ້ອງທີ່ມີຜູ້ເຊົ່າ ແຕ່ຍັງບໍ່ທັນອອກໃບບີນຂອງເດືອນທີ່ເລືອກ */
  const pendingList = () => sortRoomsByNo(pendingRooms(state.month, state.year));

  const meterRecorded = (roomNo) => {
    const v = (((APT.meterReadings || {})[roomNo] || {})[monthKeySel(state.month, state.year)]);
    return v == null ? null : Number(v);
  };

  /* ຍອດປະເມີນຂອງຫ້ອງທີ່ຍັງບໍ່ອອກໃບ — ໃຊ້ອັດຕາ ແລະ ເລກມິເຕີຂອງເດືອນນີ້ */
  function estimateFor(room) {
    const rt = ratesForMonth(state.year, state.month);
    const mp = meterPair({ room: room.no }, state.month, state.year);
    const kwh = mp.prev != null && mp.now != null ? Math.max(0, mp.now - mp.prev) : 0;
    const total =
      rt.rent +
      serviceCostFor(room.no, rt) +
      extraFeesShareFor(room.no, state.year, state.month) +
      kwh * rt.electricRate +
      waterCostFor(room.no, rt) +
      trashCostFor(room.no, rt) +
      repairCostFor(room.no, monthKeySel(state.month, state.year));
    return { rt, mp, kwh, total };
  }

  /* ອົງປະກອບຄ່າໃຊ້ຈ່າຍຂອງເດືອນ — ລວມຈາກໃບບີນທີ່ອອກແລ້ວ */
  function renderCosts() {
    const list = monthInvoices(state.month, state.year);
    const rt = ratesForMonth(state.year, state.month);
    const rateOf = (i) => invoiceRates(i);
    const sum = (f) => list.reduce((s, i) => s + f(i), 0);
    const n = list.length;

    const kwh = sum((i) => Number(i.kwh) || 0);
    const elec = sum((i) => (Number(i.kwh) || 0) * rateOf(i).electricRate);
    const water = sum((i) => waterCostFor(i.room, rateOf(i)));
    const trash = sum((i) => trashCostFor(i.room, rateOf(i)));
    const repairs = list.flatMap((i) =>
      repairItemsFor(i.room, invoiceMonthKey(i)).map((r) => ({ title: r.title, cost: Number(r.cost) || 0, room: i.room }))
    );
    const repair = repairs.reduce((s, r) => s + r.cost, 0);
    const service = sum((i) => serviceCostFor(i.room, rateOf(i)));
    const extras = otherFeesTotal(state.year, state.month);
    const other = sum((i) => Number(i.other) || 0);
    const extraShare = sum((i) => extraFeesShareFor(i.room, i.year, i.month));
    const custom = other + extraShare;

    const noWater = list.filter((i) => !waterCostFor(i.room, rateOf(i))).length;
    const noTrash = list.filter((i) => !trashCostFor(i.room, rateOf(i))).length;
    const heavy = list.slice().sort((a, b) => (Number(b.kwh) || 0) - (Number(a.kwh) || 0))[0];
    const serviceRooms = list.filter((i) => serviceCostFor(i.room, rateOf(i))).length;
    const servicePerRoom = residentRoomCount() ? Math.round((rt.serviceFee || 0) / residentRoomCount()) : 0;
    const extrasPerRoom = residentRoomCount() ? Math.round(extras / residentRoomCount()) : 0;
    const extrasRooms = list.filter((i) => extraFeesShareFor(i.room, i.year, i.month)).length;
    const feeNames = extraFeesFor(state.year, state.month).filter((f) => f.active);

    const totalCost = elec + water + trash + repair + service + custom;
    const rentTotal = sum((i) => Number(i.rent) || 0);
    document.getElementById("costSub").textContent =
      `${monthLabel(state.month, state.year)} · ຈາກ ${n} ໃບ · ລວມຄ່າໃຊ້ຈ່າຍ ${money(totalCost)} (ບໍ່ລວມຄ່າເຊົ່າ ${money(rentTotal)})`;

    const card = ({ ic, cls, sc, label, value, foot, details }) => `
      <div class="stat cost-stat stat-accent" style="--sc:${sc || "var(--primary)"}">
        <span class="stat-icon ${cls || ""}">${icon(ic, 16)}</span>
        <div class="stat-label">${label}</div>
        <div class="stat-value">${money(value)}</div>
        <div class="stat-foot">${foot}</div>
        ${details && details.length ? `<ul class="cost-detail">${details.map((d) => `<li><span>${d.k}</span><b>${d.v}</b></li>`).join("")}</ul>` : ""}
      </div>`;

    document.getElementById("costStats").innerHTML = [
      card({
        ic: "zap",
        cls: "amber",
        sc: "var(--amber)",
        label: "ຄ່າໄຟຟ້າ",
        value: elec,
        foot: `${num(kwh)} kWh ລວມ · ${money(rt.electricRate)} / kWh`,
        details: [
          { k: "ສະເລ່ຍ / ໃບ", v: money(n ? elec / n : 0) },
          { k: heavy ? `ໃຊ້ຫຼາຍສຸດ · ຫ້ອງ ${heavy.room}` : "ຍັງບໍ່ມີຂໍ້ມູນ", v: heavy ? `${num(heavy.kwh)} kWh` : "—" }
        ]
      }),
      card({
        ic: "droplet",
        cls: "cyan",
        sc: "var(--cyan)",
        label: "ຄ່ານ້ຳ",
        value: water,
        foot: `${money(rt.waterTotal)} ÷ ${residentPeople()} ຄົນຢູ່ປະຈຳ`,
        details: [
          { k: "ສະເລ່ຍ / ໃບ", v: money(n ? water / n : 0) },
          { k: "ຫ້ອງບໍ່ຖືກຄິດ (ໄປຕ່າງແຂວງ)", v: `${num(noWater)} ຫ້ອງ` }
        ]
      }),
      card({
        ic: "trash",
        cls: "violet",
        sc: "var(--violet)",
        label: "ຄ່າຂີ້ເຫຍື້ອ",
        value: trash,
        foot: `${money(rt.trashTotal)} ÷ ${residentRoomCount()} ຫ້ອງຢູ່ປະຈຳ`,
        details: [
          { k: "ສະເລ່ຍ / ໃບ", v: money(n ? trash / n : 0) },
          { k: "ຫ້ອງບໍ່ຖືກຄິດ (ໄປຕ່າງແຂວງ)", v: `${num(noTrash)} ຫ້ອງ` }
        ]
      }),
      card({
        ic: "wrench",
        cls: "danger",
        sc: "var(--danger)",
        label: "ສ້ອມແປງ",
        value: repair,
        foot: `${num(repairs.length)} ລາຍການ · ${num(new Set(repairs.map((r) => r.room)).size)} ຫ້ອງ`,
        details: repairs.length
          ? repairs
              .slice()
              .sort((a, b) => b.cost - a.cost)
              .slice(0, 3)
              .map((r) => ({ k: `ຫ້ອງ ${r.room} · ${r.title}`, v: money(r.cost) }))
          : [{ k: "ບໍ່ມີລາຍການໃນເດືອນນີ້", v: "—" }]
      }),
      card({
        ic: "wallet",
        sc: "var(--primary)",
        label: "ຄ່າບໍລິການສ່ວນກາງ",
        value: service,
        foot: rt.serviceFee
          ? `ຫານ ${residentRoomCount()} ຫ້ອງ = ${money(servicePerRoom)}/ຫ້ອງ · ຄິດ ${num(serviceRooms)} ຫ້ອງ`
          : "ຍັງບໍ່ຕັ້ງຄ່າ",
        details: [
          { k: "ຍອດລວມ / ເດືອນ", v: money(rt.serviceFee || 0) },
          { k: "ຕໍ່ຫ້ອງ / ເດືອນ", v: money(servicePerRoom) },
          { k: "ຫ້ອງທີ່ຖືກຄິດ", v: `${num(serviceRooms)} ຫ້ອງ` }
        ]
      }),
      card({
        ic: "file",
        sc: "var(--ok)",
        label: "ຄ່າບໍລິການເພີ່ມເຕີມ",
        value: custom,
        foot: feeNames.length
          ? `${num(feeNames.length)} ລາຍການ · ຫານ ${residentRoomCount()} ຫ້ອງ = ${money(extrasPerRoom)}/ຫ້ອງ · ຄິດ ${num(extrasRooms)} ຫ້ອງ`
          : "ຍັງບໍ່ມີລາຍການເພີ່ມເຕີມ",
        details: [
          ...feeNames.map((f) => ({ k: `${f.name} ÷ ${residentRoomCount()} ຫ້ອງ`, v: money(extrasPerRoom) })),
          { k: "ຄ່າອື່ນໃນໃບ", v: money(other) }
        ]
      })
    ].join("");
  }

  function renderStats() {
    const list = monthInvoices(state.month, state.year);
    const st = invoiceStats(list);
    const pending = pendingList();
    const occupied = ROOMS.filter((r) => r.status === "occupied").length;
    const recorded = pending.filter((r) => meterRecorded(r.no) != null).length;
    document.getElementById("invoiceStats").innerHTML = `
      <div class="stat hero-stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon">${icon("receipt", 16)}</span>
        <div class="stat-label">ຍອດລວມເດືອນນີ້</div>
        <div class="stat-value">${money(st.total)}</div>
        <div class="stat-foot">${list.length} ໃບ</div>
      </div>
      <div class="stat hero-stat stat-accent" style="--sc:var(--ok)">
        <span class="stat-icon">${icon("check", 16)}</span>
        <div class="stat-label">ເກັບໄດ້ແລ້ວ</div>
        <div class="stat-value">${money(st.paid)}</div>
        <div class="mini-bar"><i style="width:${st.rate}%"></i></div>
      </div>
      <div class="stat hero-stat stat-accent" style="--sc:var(--danger)">
        <span class="stat-icon danger">${icon("receipt", 16)}</span>
        <div class="stat-label">ຍັງຄ້າງ</div>
        <div class="stat-value">${money(st.unpaid)}</div>
        <div class="stat-foot">${st.unpaidCount} ໃບ</div>
      </div>
      <div class="stat hero-stat stat-accent" style="--sc:var(--cyan)">
        <span class="stat-icon cyan">${icon("chart", 16)}</span>
        <div class="stat-label">ອັດຕາເກັບເງິນ</div>
        <div class="stat-value">${st.rate}%</div>
        <div class="stat-foot">ຈາກ ${list.length} ໃບ</div>
      </div>
      <div class="stat hero-stat stat-accent" style="--sc:var(--amber)">
        <span class="stat-icon amber">${icon("clock", 16)}</span>
        <div class="stat-label">ຍັງບໍ່ທັນອອກໃບບີນເກັບເງີນ</div>
        <div class="stat-value">${num(pending.length)} ຫ້ອງ</div>
        <div class="stat-foot">ຈົດມິເຕີແລ້ວ ${recorded}/${pending.length} · ຈາກ ${occupied} ຫ້ອງ</div>
      </div>`;
  }

  function toggleRow(no) {
    if (expanded.has(no)) expanded.delete(no);
    else expanded.add(no);
    renderTable();
  }

  /* ແຖວຫ້ອງທີ່ຍັງບໍ່ອອກໃບ: ສະຖານະ + ລາຍລະອຽດ (ມິເຕີ, ຄ່ານ້ຳ, ຍອດປະເມີນ) */
  function pendingRowsHtml() {
    const q = query.trim().toLowerCase();
    return pendingList()
      .filter((r) => !q || String(r.no).includes(q) || (r.tenant || "").toLowerCase().includes(q))
      .map((r) => {
        const est = estimateFor(r);
        const t = tenantOfRoom(r.no);
        const recorded = meterRecorded(r.no);
        const water = waterCostFor(r.no, est.rt);
        return `<tr class="inv-item is-pending">
        <td class="strong mono-num" style="color:var(--muted);font-size:11px">—</td>
        <td>
          <div class="tenant-cell">
            <strong>ຫ້ອງ ${r.no}</strong>
            <span>${t ? t.name : "—"}</span>
          </div>
        </td>
        <td>${meterCell(est.mp.prev)}</td>
        <td>${meterCell(est.mp.now)}</td>
        <td>
          <div class="tenant-cell">
            <strong>${recorded != null ? `${num(est.kwh)} kWh` : "ຍັງບໍ່ຈົດ"}</strong>
            <span>${recorded != null ? money(est.kwh * est.rt.electricRate) : "—"}</span>
          </div>
        </td>
        <td>
          <div class="tenant-cell">
            <strong>${money(water)}</strong>
            <span>ປະເມີນ</span>
          </div>
        </td>
        <td class="strong num">${money(est.total)}</td>
        <td><span class="status pending"><i class="sd"></i>ຍັງບໍ່ອອກໃບ</span></td>
        <td>
          <div class="row-actions">
            <a class="btn btn-primary btn-sm" style="width:auto;padding:0 12px;text-decoration:none" href="meter.html?room=${encodeURIComponent(r.no)}">ອອກໃບ</a>
          </div>
        </td>
      </tr>`;
      })
      .join("");
  }

  function renderTable() {
    const list = monthInvoices(state.month, state.year).filter((i) => {
      const okFilter =
        filter === "all" ? true : filter === "pending" ? false : filter === "paid" ? i.paid : !i.paid;
      const q = query.trim().toLowerCase();
      const okQuery = !q || i.no.toLowerCase().includes(q) || i.room.includes(q) || i.tenant.toLowerCase().includes(q);
      return okFilter && okQuery;
    });
    /* ຮຽງຕາມເລກຫ້ອງ: 1, 2, 3, … 10, 11 */
    list.sort((a, b) => roomNoValue(a.room) - roomNoValue(b.room));

    const all = monthInvoices(state.month, state.year);
    const key = `${state.year}-${String(state.month).padStart(2, "0")}`;
    const read = all.filter((i) => ((APT.meterReadings || {})[i.room] || {})[key] != null).length;
    const pendingCount = pendingList().length;
    document.getElementById("invoiceCount").textContent =
      `${monthLabel(state.month, state.year)} · ${all.length} ໃບ` +
      (read ? ` · ຈົດມິເຕີແລ້ວ ${read}/${all.length}` : " · ຍັງບໍ່ຈົດມິເຕີ") +
      (pendingCount ? ` · ຍັງບໍ່ອອກໃບ ${num(pendingCount)} ຫ້ອງ` : "");

    const invRows = list.length
      ? list
          .map((i) => {
            const mp = meterPair(i, state.month, state.year);
            const isOpen = expanded.has(i.no);
            return `<tr class="inv-item${isOpen ? " is-open" : ""}" data-open="${i.no}">
        <td class="strong mono-num" style="color:var(--primary);font-size:11px">
          <span class="inv-no">
            <button class="inv-toggle" data-toggle-row="${i.no}" aria-expanded="${isOpen}" title="ລາຍລະອຽດສະຫຼຸບ">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
            </button>${i.no}
          </span>
        </td>
        <td>
          <div class="tenant-cell">
            <strong>ຫ້ອງ ${i.room}</strong>
            <span>${i.tenant}</span>
          </div>
        </td>
        <td>${meterCell(mp.prev)}</td>
        <td>${meterCell(mp.now)}</td>
        <td>
          <div class="tenant-cell">
            <strong>${num(i.kwh)} kWh</strong>
            <span>${money(i.kwh * invoiceRates(i).electricRate)}</span>
          </div>
        </td>
        <td>
          <div class="tenant-cell">
            <strong>${num(i.m3)} ມ³</strong>
            <span>${
              !tenantOfRoom(i.room)
                ? "ບໍ່ມີຂໍ້ມູນຜູ້ເຊົ່າ"
                : tenantOfRoom(i.room).stayStatus === "away"
                  ? "ບໍ່ຄິດ (ໄປຕ່າງແຂວງ)"
                  : money(waterCostFor(i.room))
            }</span>
          </div>
        </td>
        <td class="strong num total-amt">${money(invoiceTotal(i))}</td>
        <td>
          ${
            i.paid
              ? '<span class="status paid"><i class="sd"></i>ຊຳລະແລ້ວ</span>'
              : `<span class="status late"><i class="sd"></i>ຄ້າງຊຳລະ · ${i.due}</span>`
          }
        </td>
        <td>
          <div class="row-actions">
            ${
              i.paid
                ? `<button class="btn btn-outline btn-sm" data-toggle="${i.no}" style="width:auto;padding:0 12px">ຍົກເລີກ</button>`
                : `<button title="ຊຳລະ" data-toggle="${i.no}">${icon("check", 13, 2.6)}</button>`
            }
            <button title="ພິມໃບບີນເກັບເງີນ" data-print="${i.no}">${icon("file", 13)}</button>
            <button title="ດາວໂຫຼດໃບບີນ PDF" data-pdf="${i.no}">${icon("download", 13)}</button>
            <button class="danger" title="ລຶບ" data-del="${i.no}">${icon("trash", 13)}</button>
          </div>
        </td>
      </tr>${isOpen ? detailRow(i) : ""}`;
          })
          .join("")
      : "";

    const pendingRows = filter === "all" || filter === "pending" ? pendingRowsHtml() : "";
    document.getElementById("invoiceBody").innerHTML =
      invRows + pendingRows ||
      `<tr><td colspan="9"><div class="empty">ບໍ່ພົບໃບບີນເກັບເງີນ</div></td></tr>`;

    document.querySelectorAll("[data-toggle]").forEach((b) =>
      b.addEventListener("click", () => {
        const inv = monthInvoices(state.month, state.year).find((i) => i.no === b.dataset.toggle);
        if (!inv) return;
        inv.paid = !inv.paid;
        logActivity(
          "invoice",
          inv.paid ? "ຊຳລະໃບບີນ" : "ຍົກເລີກການຊຳລະ",
          `ໃບ ${inv.no} · ຫ້ອງ ${inv.room} · ${money(invoiceTotal(inv))}`
        );
        renderAll();
        DB.save();
        showStatusToast(
          inv.paid ? "ok" : "danger",
          inv.paid ? "ຊຳລະແລ້ວ" : "ຍົກເລີກການຊຳລະແລ້ວ",
          `ໃບ ${inv.no} · ຫ້ອງ ${inv.room} · ${money(invoiceTotal(inv))}`
        );
      })
    );
    document.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => {
        const list = monthInvoices(state.month, state.year);
        const idx = list.findIndex((i) => i.no === b.dataset.del);
        if (idx < 0) return;
        openConfirm(
          `ລຶບໃບບີນເກັບເງີນ ${list[idx].no}?`,
          "ໃບບີນເກັບເງີນນີ້ຈະຖືກລຶບອອກຈາກເດືອນນີ້ ແລະ ບັນທຶກລົງຖານຂໍ້ມູນທັນທີ.",
          () => {
            logActivity(
              "invoice",
              "ລຶບໃບບີນ",
              `ໃບ ${list[idx].no} · ຫ້ອງ ${list[idx].room} · ${money(invoiceTotal(list[idx]))}`
            );
            list.splice(idx, 1);
            renderAll();
            DB.save();
          }
        );
      })
    );
    document.querySelectorAll("[data-print]").forEach((b) =>
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        const inv = monthInvoices(state.month, state.year).find((i) => i.no === b.dataset.print);
        if (!inv) return;
        openBillPreview(inv);
      })
    );
    document.querySelectorAll("[data-pdf]").forEach((b) =>
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        const inv = monthInvoices(state.month, state.year).find((i) => i.no === b.dataset.pdf);
        if (!inv) return;
        downloadBillPdf(inv);
      })
    );
    document.querySelectorAll("#invoiceBody tr.inv-item").forEach((tr) =>
      tr.addEventListener("click", (e) => {
        if (e.target.closest(".row-actions")) return;
        toggleRow(tr.dataset.open);
      })
    );

    /* ປຸ່ມຂະຫຍາຍ ໃ ຫຍໍ້ ລາຍລະອຽດທັງໝົດ */
    const visibleNos = list.map((i) => i.no);
    const allOpen = visibleNos.length > 0 && visibleNos.every((n) => expanded.has(n));
    const expandBtn = document.getElementById("expandAll");
    expandBtn.textContent = allOpen ? "ຫຍໍ້ທັງໝົດ" : "ຂະຫຍາຍທັງໝົດ";
    expandBtn.dataset.mode = allOpen ? "close" : "open";
  }

  document.getElementById("expandAll").addEventListener("click", (e) => {
    const list = monthInvoices(state.month, state.year);
    if (e.currentTarget.dataset.mode === "close") expanded.clear();
    else list.forEach((i) => expanded.add(i.no));
    renderTable();
  });

  /* ຂໍ້ຄວາມປະຈຳເດືອນ — ຕັ້ງຈາກໜ້າຕັ້ງຄ່າ */
  function renderNote() {
    const card = document.getElementById("monthNoteCard");
    const text = monthNoteFor(state.year, state.month);
    const text2 = monthNote2For(state.year, state.month);
    if (!text && !text2) {
      card.hidden = true;
      return;
    }
    card.hidden = false;
    document.getElementById("monthNoteMonth").textContent = monthLabel(state.month, state.year);
    const p1 = document.getElementById("monthNoteText");
    const p2 = document.getElementById("monthNoteText2");
    p1.textContent = text;
    p1.hidden = !text;
    p2.textContent = text2;
    p2.hidden = !text2;
    document.getElementById("monthNoteEdit").href = `settings.html?y=${state.year}&m=${state.month}#monthNoteCard`;
  }

  function renderAll() {
    renderStats();
    renderCosts();
    renderNote();
    renderTable();
    /* ອັບເດດປ້າຍນັບໃບບີນຄ້າງ ຢູ່ເມນູ ຫຼັງກົດຊຳລະ / ຍົກເລີກ / ລຶບ */
    refreshNavBadges();
  }

  document.getElementById("invoiceSearch").addEventListener("input", (e) => {
    query = e.target.value;
    renderTable();
  });
  document.getElementById("invoiceTabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-filter]");
    if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll("#invoiceTabs button").forEach((x) => x.classList.toggle("on", x === b));
    renderTable();
  });

  /* ປຸ່ມໃນໂມດານເບິ່ງໃບບີນກ່ອນພິມ */
  const billBack = document.getElementById("billPreview");
  /* ປິດໄດ້ດ້ວຍປຸ່ມ “ປິດ” ເທົ່ານັ້ນ — ກົດພື້ນຫຼັງ ຫຼື Esc ຈະບໍ່ປິດ */
  billBack.addEventListener("click", (e) => {
    if (e.target.closest("[data-preview-close]")) closeBillPreview();
  });
  billBack.querySelector("[data-preview-print]").addEventListener("click", printPreviewBill);
  billBack.querySelector("[data-preview-pdf]").addEventListener("click", () => downloadBillPdf(previewInv));

  DB.ready.then(() => {
    /* ຖ້າເດືອນປັດຈຸບັນຍັງບໍ່ມີໃບ ໃຫ້ເປີດເດືອນທີ່ມີໃບຫຼ້າສຸດແທນ (ເວັ້ນເມື່ອມາຈາກລິ້ງ ?y=&m=) */
    const latest = monthWithInvoices();
    if (!monthFromQuery() && !(INVOICE_MONTHS[`${state.year}-${state.month}`] || []).length && latest) state = latest;
    monthSwitch(document.getElementById("monthSwitch"), {
      start: state,
      min: earliestDataMonth() || { year: 2026, month: 10 },
      max: latestDataMonth(),
      onChange: (s) => {
        state = s;
        renderAll();
      }
    });
    renderAll();
  });
});
</script>
</body>
</html>
