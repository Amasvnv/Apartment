<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ການເຄື່ອນໄຫວ — ລະບົບຈັດການອາພາດເມັນ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="activity">
<main class="page-wrap">
  <div class="page-head">
    <div>
      <h1>ການເຄື່ອນໄຫວ</h1>
      <p class="card-sub" style="margin:4px 0 0">ບັນທຶກການເພີ່ມ · ແກ້ໄຂ · ລຶບ ຂອງຂໍ້ມູນທັງໝົດໃນລະບົບ</p>
    </div>
  </div>

  <section class="card card-pad mt-14">
    <div class="table-head" style="padding:0 0 14px">
      <div>
        <h2>ລາຍການການເຄື່ອນໄຫວ</h2>
        <div class="t-sub" id="actCount">—</div>
      </div>
      <div class="grow"></div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="actSearch" placeholder="ຄົ້ນຫາລາຍລະອຽດ">
      </div>
      <div class="tabs" id="actTabs">
        <button class="on" data-kind="all">ທັງໝົດ</button>
        <button data-kind="tenant">ຜູ້ເຊົ່າ</button>
        <button data-kind="room">ຫ້ອງພັກ</button>
        <button data-kind="invoice">ໃບບີນ</button>
        <button data-kind="meter">ຈົດມິເຕີ</button>
        <button data-kind="repair">ສ້ອມແປງ</button>
        <button data-kind="settings">ຕັ້ງຄ່າ</button>
      </div>
    </div>
    <div class="act-list" id="actList"></div>
    <div class="pager" id="actPager"></div>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/db.config.js"></script>
<script src="assets/db.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let query = "";
  let kind = "all";
  const PAGE_SIZE = 10;
  let page = 1;

  const KIND_COLOR = {
    tenant: "var(--primary)",
    room: "var(--violet)",
    invoice: "var(--ok)",
    meter: "var(--cyan)",
    repair: "var(--amber)",
    settings: "var(--muted)"
  };

  const pad2 = (n) => String(n).padStart(2, "0");

  function whenText(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return { main: "—", sub: "" };
    const main = `${pad2(d.getDate())} ${shortMonth(d.getMonth() + 1, d.getFullYear())} · ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    return { main, sub: relTime(d) };
  }

  function relTime(d) {
    const diff = Date.now() - d.getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return "ຫາກໍ່ນີ້";
    if (min < 60) return `${min} ນາທີກ່ອນ`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr} ຊົ່ວໂມງກ່ອນ`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day} ມື້ກ່ອນ`;
    return "";
  }

  function render() {
    const q = query.trim().toLowerCase();
    const all = APT.activity || [];
    const list = all.filter(
      (a) =>
        (kind === "all" || a.kind === kind) &&
        (!q || (a.title + " " + a.detail).toLowerCase().includes(q))
    );

    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (page > pages) page = pages;
    const start = (page - 1) * PAGE_SIZE;
    const rows = list.slice(start, start + PAGE_SIZE);

    document.getElementById("actCount").textContent = list.length
      ? `ທັງໝົດ ${list.length} ລາຍການ${pages > 1 ? ` · ໜ້າ ${page}/${pages}` : ""}`
      : "ຍັງບໍ່ມີລາຍການ";

    document.getElementById("actList").innerHTML = rows.length
      ? rows
          .map((a) => {
            const k = activityKind(a.kind);
            const w = whenText(a.t);
            const meta = a.detail || k.label;
            return `<div class="act-row" style="--kc:${KIND_COLOR[a.kind] || "var(--muted)"}">
              <span class="act-ico">${icon(k.icon, 14)}</span>
              <div class="act-body">
                <strong>${a.title}</strong>
                <span>${meta}</span>
              </div>
              <div class="act-when">${w.main}${w.sub ? `<em>${w.sub}</em>` : ""}${
                a.by ? `<em class="act-by">${icon("user", 11)} ${a.by}</em>` : ""
              }</div>
            </div>`;
          })
          .join("")
      : `<div class="empty">ຍັງບໍ່ມີການເຄື່ອນໄຫວ — ເມື່ອມີການເພີ່ມ / ແກ້ໄຂ / ລຶບຂໍ້ມູນ ຈະສະແດງຢູ່ນີ້</div>`;

    const pager = document.getElementById("actPager");
    pager.innerHTML =
      pages > 1
        ? Array.from({ length: pages }, (_, i) => i + 1)
            .map((n) => `<button class="${n === page ? "on" : ""}" data-page="${n}">${n}</button>`)
            .join("")
        : "";
  }

  document.getElementById("actSearch").addEventListener("input", (e) => {
    query = e.target.value;
    page = 1;
    render();
  });

  document.getElementById("actPager").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-page]");
    if (!b) return;
    page = Number(b.dataset.page) || 1;
    render();
  });

  document.getElementById("actTabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-kind]");
    if (!b) return;
    kind = b.dataset.kind;
    page = 1;
    document.querySelectorAll("#actTabs button").forEach((x) => x.classList.toggle("on", x === b));
    render();
  });

  DB.ready.then(render);
});
</script>
</body>
</html>
