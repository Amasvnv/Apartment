<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ຜູ້ເຊົ່າ — ລະບົບຈັດການອາພາດເມັນ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="tenants">
<main class="page-wrap">
  <div class="page-head">
    <div>
      <h1>ທະບຽນຜູ້ເຊົ່າ</h1>
    </div>
    <div class="head-actions">
      <button class="btn btn-add-room" id="addTenantBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
        ເພີ່ມຜູ້ເຊົ່າ
      </button>
    </div>
  </div>

  <div class="stat-grid grid-3" id="tenantStats"></div>

  <section class="card card-pad mt-14">
    <div class="table-head" style="padding:0 0 14px">
      <div>
        <h2>ລາຍຊື່ຜູ້ເຊົ່າ</h2>
        <div class="t-sub" id="tenantCount">ທັງໝົດ 9 ຄົນ</div>
      </div>
      <div class="grow"></div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="tenantSearch" placeholder="ຄົ້ນຫາຊື່, ເບີໂທ, ຫ້ອງ">
      </div>
    </div>
    <div class="tenant-grid" id="tenantGrid"></div>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/db.config.js"></script>
<script src="assets/db.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let query = "";

  /* ---------------- ວັນເຂົ້າຢູ່: ວັນນີ້ເປັນຄ່າເລີ່ມຕົ້ນ ແລະ ປ່ຽນເອງໄດ້ ---------------- */
  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  /* ຮັບໄດ້ທັງ ISO (2026-11-01) ແລະ ຂໍ້ມູນເກົ່າແບບ “01 ພ.ຈ. 26” ແລ້ວຄືນເປັນ ISO */
  function parseMoveIn(v) {
    const s = String(v || "").trim();
    const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) return `${iso[1]}-${iso[2].padStart(2, "0")}-${iso[3].padStart(2, "0")}`;
    const parts = s.split(/\s+/);
    const idx = MONTH_SHORT.indexOf(parts[1]);
    const day = (parts[0] || "").match(/^(\d{1,2})$/);
    const yr = (parts[2] || "").match(/^(\d{2})$/);
    if (idx >= 0 && day && yr) return `20${yr[1]}-${String(idx + 1).padStart(2, "0")}-${day[1].padStart(2, "0")}`;
    return "";
  }
  /* ສະແດງເປັນ “01 ພ.ຈ. 26” — ຖ້າບໍ່ສາມາດແປງໄດ້ ສະແດງຄ່າເດີມ */
  function moveInLabel(v) {
    const iso = parseMoveIn(v);
    if (!iso) return v || "—";
    const [y, m, d] = iso.split("-");
    return `${d} ${shortMonth(Number(m), Number(y))}`;
  }

  function renderStats() {
    const deposit = TENANTS.reduce((s, t) => s + t.deposit, 0);

    /* ຈຳນວນຄົນທັ້ງໝົດ — ບໍ່ລວມຜູ້ທີ່ “ໄປຕ່າງແຂວງ” */
    const peopleOf = (t) => Number(t.people) || 0;
    const awayList = TENANTS.filter((t) => t.stayStatus === "away");
    const awayPeople = awayList.reduce((s, t) => s + peopleOf(t), 0);
    const peopleCount = TENANTS.reduce((s, t) => s + peopleOf(t), 0) - awayPeople;

    document.getElementById("tenantCount").textContent = `ທັງໝົດ ${peopleCount} ຄົນ`;
    document.getElementById("tenantStats").innerHTML = `
      <div class="stat hero-stat stat-accent" style="--sc:var(--primary)">
        <span class="stat-icon">${icon("users", 17)}</span>
        <div class="stat-label">ຜູ້ເຊົ່າທັງໝົດ</div>
        <div class="stat-value">${peopleCount}</div>
      </div>
      <div class="stat hero-stat stat-accent" style="--sc:var(--amber)">
        <span class="stat-icon amber">${icon("wind", 17)}</span>
        <div class="stat-label">${stayStatus("away").label}</div>
        <div class="stat-value">${awayPeople}</div>
        <div class="stat-foot">${awayList.length} ສັນຍາ</div>
      </div>
      <div class="stat hero-stat stat-accent" style="--sc:var(--violet)">
        <span class="stat-icon amber">${icon("wallet", 17)}</span>
        <div class="stat-label">ເງິນມັດຈຳລວມ</div>
        <div class="stat-value">${money(deposit)}</div>
        <div class="stat-foot">ລວມທຸກສັນຍາ</div>
      </div>`;
  }

  function renderGrid() {
    const q = query.trim().toLowerCase();
    const list = TENANTS.filter(
      (t) =>
        !q ||
        t.name.toLowerCase().includes(q) ||
        t.phone.includes(q) ||
        t.room.includes(q)
    ).sort(
      (a, b) =>
        roomNoValue(a.room) - roomNoValue(b.room) ||
        String(a.room).localeCompare(String(b.room), "lo", { numeric: true })
    );

    document.getElementById("tenantGrid").innerHTML = list.length
      ? list
          .map(
            (t) => `<article class="t-card" style="--sc:var(--primary)">
        <div class="t-top">
          <span class="t-ava">${initials(t.name)}</span>
          <div class="t-name"><strong>${t.name}</strong><span>${t.phone}</span></div>
          <div class="t-actions">
            <button title="ແກ້ໄຂ" data-edit="${t.room}">${icon("edit", 13)}</button>
            <button class="danger" title="ລຶບ" data-del="${t.room}">${icon("trash", 13)}</button>
          </div>
        </div>
        <div class="t-tags">
          <span class="chip blue">ຫ້ອງ ${t.room}</span>
          <span class="chip ${t.contract === "1 ປີ" ? "cyan" : "muted"}">${t.contract}</span>
          <span class="chip ${stayStatus(t.stayStatus).cls}">${stayStatus(t.stayStatus).label}</span>
        </div>
        <div class="t-lines">
          <div class="t-line"><span>ເຂົ້າຢູ່</span><b>${moveInLabel(t.moveIn)}</b></div>
          <div class="t-line"><span>ຈຳນວນຄົນທີ່ເຂົ້າຢູ່</span><b>${t.people} ຄົນ</b></div>
          <div class="t-line"><span>ເງິນມັດຈຳ</span><b>${money(t.deposit)}</b></div>
        </div>
      </article>`
          )
          .join("")
      : '<div class="empty" style="grid-column:1/-1">ບໍ່ພົບຜູ້ເຊົ່າທີ່ຄົ້ນຫາ</div>';

    document.querySelectorAll("[data-edit]").forEach((b) =>
      b.addEventListener("click", () => openTenantForm(TENANTS.find((t) => t.room === b.dataset.edit)))
    );
    document.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => {
        const t = TENANTS.find((x) => x.room === b.dataset.del);
        if (!t) return;
        openConfirm(
          `ລຶບຜູ້ເຊົ່າ ${t.name}?`,
          `ຜູ້ເຊົ່າຫ້ອງ ${t.room} ຈະຖືກລຶບອອກຈາກທະບຽນ ແລະ ບັນທຶກລົງຖານຂໍ້ມູນທັນທີ.`,
          () => {
            logActivity("tenant", "ລຶບຜູ້ເຊົ່າ", `${t.name} · ຫ້ອງ ${t.room}`);
            TENANTS.splice(TENANTS.indexOf(t), 1);
            renderAll();
            DB.save();
          }
        );
      })
    );
  }

  function openTenantForm(t) {
    const isEdit = !!t;
    // ຫ້ອງທີ່ຖືກມອບໝາຍໃຫ້ຜູ້ເຊົ່າແລ້ວ ຈະບໍ່ສະແດງໃນຟອມເພີ່ມໃໝ່ (ແກ້ໄຂໄດ້ສະເພາະຫ້ອງເດີມ)
    const takenBy = (no) => TENANTS.find((x) => x.room === no && (!isEdit || x !== t));
    const roomOptions = sortRoomsByNo(ROOMS.filter((r) => !takenBy(r.no)))
      .map((r) => `<option value="${r.no}" ${isEdit && t.room === r.no ? "selected" : ""}>ຫ້ອງ ${r.no}</option>`)
      .join("");

    openModal(
      isEdit ? "ແກ້ໄຂຂໍ້ມູນຜູ້ເຊົ່າ" : "ເພີ່ມຜູ້ເຊົ່າໃໝ່",
      isEdit ? t.phone : "ບັນທຶກສັນຍາເຊົ່າ ແລະ ຫ້ອງພັກ",
      `<div class="m-grid">
        <div class="field full"><label>ຊື່ ແລະ ນາມສະກຸນ</label><input class="input" id="fName" value="${isEdit ? t.name : ""}" placeholder="ນາງ ສຸກສະຫວັນ ພິມະສານ"></div>
        <div class="field"><label>ເບີໂທ</label><input class="input" id="fPhone" value="${isEdit ? t.phone : ""}" placeholder="020 00 000 000"></div>
        <div class="field"><label>ຫ້ອງ</label><select class="input" id="fRoom">${roomOptions || '<option value="">ບໍ່ມີຫ້ອງວ່າງ</option>'}</select></div>
        <div class="field"><label>ວັນເຂົ້າຢູ່</label><input class="input" id="fMoveIn" type="date" value="${isEdit ? parseMoveIn(t.moveIn) || todayISO() : todayISO()}"></div>
        <div class="field"><label>ສັນຍາ</label>
          <select class="input" id="fContract">
            <option ${isEdit && t.contract !== "1 ປີ" ? "selected" : ""}>ບໍ່ມີສັນຍາ</option>
            <option ${isEdit && t.contract === "1 ປີ" ? "selected" : ""}>1 ປີ</option>
          </select>
        </div>
        <div class="field"><label>ສະຖານະຜູ້ເຊົ່າ</label>
          <select class="input" id="fStay">
            <option value="resident" ${!isEdit || (t.stayStatus || "resident") === "resident" ? "selected" : ""}>ຢູ່ປະຈຳ</option>
            <option value="away" ${isEdit && t.stayStatus === "away" ? "selected" : ""}>ໄປຕ່າງແຂວງ</option>
          </select>
        </div>
        <div class="field"><label>ຈຳນວນຄົນ</label><input class="input" id="fPeople" type="number" value="${isEdit ? t.people : 1}"></div>
        <div class="field"><label>ເງິນມັດຈຳ</label><input class="input" id="fDeposit" type="number" value="${isEdit ? t.deposit : 0}" placeholder="0"></div>
      </div>
      <div class="hint-line" id="formHint" style="margin-top:10px;color:var(--danger)"></div>`,
      (back) => {
        const name = back.querySelector("#fName").value.trim();
        if (!name) return false;
        const room = back.querySelector("#fRoom").value;
        const hint = back.querySelector("#formHint");
        if (!room) {
          hint.textContent = "ບໍ່ມີຫ້ອງວ່າງ — ທຸກຫ້ອງມີຜູ້ເຊົ່າແລ້ວ";
          return false;
        }
        if (takenBy(room)) {
          hint.textContent = `ຫ້ອງ ${room} ມີຜູ້ເຊົ່າແລ້ວ`;
          return false;
        }
        const data = {
          name,
          phone: back.querySelector("#fPhone").value.trim(),
          room,
          contract: back.querySelector("#fContract").value,
          stayStatus: back.querySelector("#fStay").value,
          moveIn: back.querySelector("#fMoveIn").value || todayISO(),
          people: Number(back.querySelector("#fPeople").value) || 1,
          deposit: Number(back.querySelector("#fDeposit").value) || 0
        };
        if (isEdit) Object.assign(t, data);
        else TENANTS.push(data);
        logActivity(
          "tenant",
          isEdit ? "ແກ້ໄຂຜູ້ເຊົ່າ" : "ເພີ່ມຜູ້ເຊົ່າ",
          `${data.name} · ຫ້ອງ ${data.room} · ${tenantPeople(data)} ຄົນ`
        );
        renderAll();
        DB.save();
      }
    );
  }

  function renderAll() {
    renderStats();
    renderGrid();
  }

  document.getElementById("tenantSearch").addEventListener("input", (e) => {
    query = e.target.value;
    renderGrid();
  });
  document.getElementById("addTenantBtn").addEventListener("click", () => openTenantForm(null));

  DB.ready.then(renderAll);
});
</script>
</body>
</html>
