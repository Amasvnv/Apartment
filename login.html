<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ເຂົ້າສູ່ລະບົບ — ລະບົບຈັດການອາພາດເມັນ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Serif+Lao:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="login">

  <form class="login-card" id="loginForm" autocomplete="off">
    <img class="login-logo" src="assets/logo.png" alt="ເຮືອນພັກ ສຸວັນນະວົງ · Souvannavong Guesthouse">

    <h1>ເຂົ້າສູ່ລະບົບ</h1>
    <p class="login-sub">ເລືອກຊື່ຜູ້ໃຊ້ ແລ້ວໃສ່ PIN ເພື່ອເຂົ້າໃຊ້ງານ</p>

    <div class="field">
      <label for="loginUser">ຜູ້ໃຊ້</label>
      <select class="input" id="loginUser"></select>
    </div>

    <div class="field" style="margin-top:12px">
      <label for="loginPin">PIN</label>
      <input class="input" id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    </div>

    <div class="login-err" id="loginErr">PIN ບໍ່ຖືກ — ລອງໃໝ່ອີກຄັ້ງ</div>

    <button class="btn btn-primary" type="submit" id="loginBtn">ເຂົ້າສູ່ລະບົບ</button>
    <div class="login-hint" id="loginHint">—</div>
  </form>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/db.config.js"></script>
<script src="assets/db.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const select = document.getElementById("loginUser");
  const pin = document.getElementById("loginPin");
  const err = document.getElementById("loginErr");
  const hint = document.getElementById("loginHint");

  /* ເຂົ້າສູ່ລະບົບແລ້ວ → ໄປໜ້າຫຼັກ */
  if (currentUser()) {
    location.replace("index.html");
    return;
  }

  const active = () => (APT.users || []).filter((u) => u.active !== false);

  function fill() {
    const list = active();
    select.innerHTML = list.length
      ? list
          .map(
            (u) =>
              `<option value="${u.id}">${u.name}${
                u.role === "manager" ? " · ຜູ້ຈັດການ" : ""
              }</option>`
          )
          .join("")
      : `<option value="">ຍັງບໍ່ມີຜູ້ໃຊ້</option>`;
    select.disabled = !list.length;
    document.getElementById("loginBtn").disabled = !list.length;
    hint.textContent = list.length
      ? "PIN ເລີ່ມຕົ້ນ 1234 — ປ່ຽນໄດ້ໃນໜ້າ ຜູ້ໃຊ້"
      : "ຕ້ອງເພີ່ມຜູ້ໃຊ້ກ່ອນ — ເປີດໜ້າ users.html ຖ້າເຂົ້າລະບົບໄດ້ແລ້ວ";
  }

  fill();
  if (typeof DB !== "undefined") DB.ready.then(fill).catch(() => {});

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const u = (APT.users || []).find((x) => x.id === select.value);
    const code = pin.value.replace(/\D/g, "");
    if (u && u.active !== false && u.pin && code === u.pin) {
      setSession(u);
      location.replace("index.html");
      return;
    }
    err.classList.add("on");
    pin.value = "";
    pin.focus();
  });

  pin.addEventListener("input", () => err.classList.remove("on"));
  pin.focus();
});
</script>
</body>
</html>
